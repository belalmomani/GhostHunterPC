name: Build GhostHunterPC for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'GhostHunterPC.sln'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore .\GhostHunterPC.sln

      - name: Build solution
        run: dotnet build .\GhostHunterPC.sln --configuration Release --no-restore

      - name: Run smoke tests
        run: dotnet test .\tests\GhostHunterPC.SmokeTests\GhostHunterPC.SmokeTests.csproj --configuration Release --no-restore

      - name: Publish self-contained Windows x64 app
        run: dotnet publish .\src\GhostHunterPC\GhostHunterPC.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --output .\artifacts\publish

      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path .\artifacts\publish\* -DestinationPath .\artifacts\GhostHunterPC-win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostHunterPC-win-x64
          path: .\artifacts\GhostHunterPC-win-x64.zip
          if-no-files-found: error
          retention-days: 14

